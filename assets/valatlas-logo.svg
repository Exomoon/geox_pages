<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <linearGradient id="wmGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E5E65" />
      <stop offset="100%" stop-color="#093F44" />
    </linearGradient>
    <linearGradient id="wmGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B8792" />
      <stop offset="100%" stop-color="#0D5C63" />
    </linearGradient>
    <linearGradient id="wmGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64B6AC" />
      <stop offset="100%" stop-color="#3A8A85" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (48x48 scale shifted to 80x80) -->

    <rect x="0" y="0" width="36" height="36" rx="6" fill="url(#wmGrad1)" />
    <rect x="44" y="0" width="36" height="36" rx="6" fill="url(#wmGrad2)" />
    <rect x="0" y="44" width="36" height="36" rx="6" fill="url(#wmGrad3)" />
    <rect x="44" y="44" width="36" height="36" rx="6" fill="#06282B" />
    <!-- Center Geo Point -->
    <circle cx="40" cy="40" r="4" fill="#F8F7F4" />
  </g>

  <!-- Typography: VALATLAS -->
  <text x="150" y="94" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.03em" fill="#121816">VALATLAS</text>

  <!-- Subline / Coordinates -->
  <text x="152" y="118" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.22em" fill="#0D5C63" opacity="0.9">SVENSK VALGEOGRAFI &amp; DATA</text>
